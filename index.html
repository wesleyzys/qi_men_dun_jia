<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qi Men Dun Jia — Eight Gates System</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border: #334155;
            --grid-gold: #f59e0b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 20px;
        }

        .sidebar {
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            height: fit-content;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-bottom: 5px;
        }

        input, select, button {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: #0f172a;
            color: var(--text-main);
            box-sizing: border-box;
        }

        button {
            background: var(--accent);
            color: #000;
            font-weight: bold;
            cursor: pointer;
            border: none;
            margin-top: 10px;
            transition: background 0.2s;
        }

        button:hover { background: var(--accent-hover); color: #fff; }

        .main-content {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            background: var(--border);
            padding: 10px;
            border-radius: 8px;
            aspect-ratio: 1 / 1;
            max-width: 550px;
            margin: 0 auto;
            width: 100%;
        }

        .palace-card {
            background: var(--panel-bg);
            border-radius: 6px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            font-size: 0.85rem;
            position: relative;
        }

        .palace-header {
            display: flex;
            justify-content: space-between;
            color: var(--grid-gold);
            font-weight: bold;
            border-bottom: 1px solid var(--border);
            padding-bottom: 4px;
        }

        .palace-symbols {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
            margin: 8px 0;
        }

        .tag {
            background: #334155;
            padding: 2px 4px;
            border-radius: 3px;
            font-size: 0.75rem;
            text-align: center;
        }

        .tabs {
            display: flex;
            gap: 10px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
            overflow-x: auto;
        }

        .tab-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-sub);
            width: auto;
            padding: 8px 16px;
            margin: 0;
            white-space: nowrap;
        }

        .tab-btn.active {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
        }

        .tab-content {
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            min-height: 200px;
        }

        pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            color: var(--text-sub);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="sidebar">
        <h2>Qi Men Dun Jia</h2>
        <div class="form-group">
            <label>Datetime</label>
            <input type="datetime-local" id="datetime">
        </div>
        <div class="form-group">
            <label>Plate Type</label>
            <select id="plateType">
                <option value="birth">Birth Plate (本命局)</option>
                <option value="event">Event Plate (问事局)</option>
            </select>
        </div>
        <div class="form-group">
            <label>Longitude (Optional for True Solar Time)</label>
            <input type="number" id="longitude" placeholder="120.0" step="0.1">
        </div>
        <button onclick="generatePlate()">Generate Plate</button>
    </div>

    <div class="main-content">
        <div class="grid-container" id="gridDisplay"></div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('caiguan')">Wealth & Career</button>
            <button class="tab-btn" onclick="switchTab('event')">Event Reading</button>
            <button class="tab-btn" onclick="switchTab('huaqizhen')">Array Placement</button>
            <button class="tab-btn" onclick="switchTab('yishenhuanjiang')">Transformation</button>
            <button class="tab-btn" onclick="switchTab('hunlian')">Marriage & Romance</button>
            <button class="tab-btn" onclick="switchTab('xingge')">Personality</button>
        </div>

        <div class="tab-content" id="tabOutput">
            <p>Select a tab and click "Generate Plate" to run detailed diagnostics.</p>
        </div>
    </div>
</div>

<script>
    let currentPlateData = null;
    let activeTab = 'caiguan';

    document.getElementById('datetime').value = new Date().toISOString().slice(0, 16);

    async function generatePlate() {
        const datetime = document.getElementById('datetime').value.replace('T', ' ');
        const type = document.getElementById('plateType').value;
        const longitude = document.getElementById('longitude').value;

        const response = await fetch('/api/qiju', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ datetime, type, longitude })
        });

        currentPlateData = await response.json();
        renderGrid(currentPlateData);
        runDiagnostic(activeTab);
    }

    function renderGrid(data) {
        const grid = document.getElementById('gridDisplay');
        grid.innerHTML = '';

        if (!data.palaces) return;

        data.palaces.forEach(palace => {
            const card = document.createElement('div');
            card.className = 'palace-card';
            card.innerHTML = `
                <div class="palace-header">
                    <span>${palace.name} (${palace.number}宫)</span>
                    <span>${palace.wuxing || ''}</span>
                </div>
                <div class="palace-symbols">
                    <div class="tag">Star: ${palace.star || '-'}</div>
                    <div class="tag">Gate: ${palace.gate || '-'}</div>
                    <div class="tag">Deity: ${palace.deity || '-'}</div>
                    <div class="tag">Heaven: ${palace.heaven_stem || '-'}</div>
                </div>
                <div style="font-size:0.7rem; color: var(--text-sub);">
                    State: ${palace.state || 'N/A'}
                </div>
            `;
            grid.appendChild(card);
        });
    }

    function switchTab(tabName) {
        activeTab = tabName;
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');
        if (currentPlateData) {
            runDiagnostic(tabName);
        }
    }

    async function runDiagnostic(tabName) {
        const outputBox = document.getElementById('tabOutput');
        outputBox.innerHTML = '<p>Processing diagnostic...</p>';

        const endpointMap = {
            caiguan: '/api/caiguan',
            event: '/api/event',
            huaqizhen: '/api/huaqizhen',
            yishenhuanjiang: '/api/yishenhuanjiang',
            hunlian: '/api/hunlian',
            xingge: '/api/xingge'
        };

        const response = await fetch(endpointMap[tabName], {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ question: '事业' })
        });

        const result = await response.json();
        outputBox.innerHTML = `<pre>${JSON.stringify(result, null, 2)}</pre>`;
    }
</script>
</body>
</html>
